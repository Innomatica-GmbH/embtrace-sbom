[project]
name = "jochwacht-sbom"
version = "0.13.1"
description = "SBOM generation for embedded builds — CMake, Meson, Autotools, Yocto, Buildroot, Zephyr, vcpkg — one command writes a CycloneDX bill of materials from your build; sends nothing unless you say so."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Innomatica GmbH", email = "office@innomatica.de" }]
keywords = ["cra", "cyber-resilience-act", "sbom", "compliance", "embedded", "dependencies"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://jochwacht.dev/check"
Source = "https://github.com/Innomatica-GmbH/jochwacht-sbom"
Privacy = "https://jochwacht.dev/check-privacy"

[project.scripts]
jochwacht-sbom = "jochwacht_sbom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jochwacht_sbom"]

[tool.hatch.build.targets.sdist]
# Kein exclude: placeholder/ und shim/ gibt es seit dem Umzug nicht mehr, und
# include unten entscheidet ohnehin.
include = ["src/", "tests/", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# Same rule set as the jochwacht main repo — the vendored analyzer/sbom
# modules must stay lint-clean under identical rules in both repos.
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TC"]
ignore = ["TC003"]

[tool.pytest.ini_options]
testpaths = ["tests"]

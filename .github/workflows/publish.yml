name: publish
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }   # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
  # The forwarding shell embtrace-check 0.9.0 was published once (its last
  # release); PyPI refuses re-uploads, so that job is gone.
  binary:
    runs-on: ubuntu-22.04   # aeltere glibc = laeuft auf mehr Zielsystemen
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install . pyinstaller
      - run: pyinstaller embtrace-sbom.spec --clean --noconfirm
      - run: |
          BIN=embtrace-sbom-${GITHUB_REF_NAME#v}-linux-x86_64
          mv dist/embtrace-sbom "dist/$BIN"
          ( cd dist && sha256sum "$BIN" > "$BIN.sha256" )
      - uses: softprops/action-gh-release@v2
        with:
          name: embtrace-sbom ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: "dist/embtrace-sbom-*"

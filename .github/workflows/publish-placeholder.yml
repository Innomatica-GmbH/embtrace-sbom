name: publish-placeholder
# The name reservation jochwacht on PyPI. Published by its own tag so a
# routine release can never push it by accident.
on:
  push:
    tags: ["jochwacht-placeholder-v*"]
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }   # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build placeholder-jochwacht
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: placeholder-jochwacht/dist }

[project]
name = "jochwacht"
version = "0.0.1"
description = "Name reserved by Innomatica GmbH. The open-source CRA Readiness Check collector is published as jochwacht-sbom — see https://jochwacht.dev."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Innomatica GmbH", email = "office@innomatica.de" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://jochwacht.dev"
Collector = "https://github.com/Innomatica-GmbH/jochwacht-sbom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jochwacht"]

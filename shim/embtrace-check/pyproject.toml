[project]
name = "embtrace-check"
version = "0.12.0"
description = "embtrace-check is now jochwacht-sbom (same tool, new name). This package installs jochwacht-sbom and keeps the embtrace-check command working. Final release under the old name."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Innomatica GmbH", email = "office@innomatica.de" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = ["jochwacht-sbom>=0.12.0"]

[project.urls]
Homepage = "https://jochwacht.dev/check"
Source = "https://github.com/Innomatica-GmbH/jochwacht-sbom"

[project.scripts]
embtrace-check = "embtrace_check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embtrace_check"]
